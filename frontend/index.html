<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 600px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 2.5em;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    button:active {
      transform: translateY(0);
    }
    .result {
      margin-top: 30px;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 8px;
      display: none;
    }
    .result.show {
      display: block;
    }
    .short-url {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .short-url input {
      flex: 1;
      background: white;
    }
    .copy-btn {
      width: auto;
      padding: 12px 24px;
      background: #4caf50;
    }
    .copy-btn:hover {
      background: #45a049;
    }
    .analytics {
      margin-top: 15px;
      padding: 15px;
      background: white;
      border-radius: 8px;
    }
    .analytics h3 {
      color: #667eea;
      margin-bottom: 10px;
    }
    .stat {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e0e0e0;
    }
    .stat:last-child {
      border-bottom: none;
    }
    .error {
      color: #f44336;
      padding: 10px;
      background: #ffebee;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
    }
    .error.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔗 URL Shortener</h1>
    
    <div class="form-group">
      <label for="originalUrl">Enter URL to shorten:</label>
      <input type="url" id="originalUrl" placeholder="https://example.com/very/long/url" required>
    </div>
    
    <button onclick="shortenUrl()">Shorten URL</button>
    
    <div class="error" id="error"></div>
    
    <div class="result" id="result">
      <h3>✨ Your shortened URL:</h3>
      <div class="short-url">
        <input type="text" id="shortUrl" readonly>
        <button class="copy-btn" onclick="copyUrl()">Copy</button>
      </div>
      
      <button onclick="refreshAnalytics()" style="margin-top: 15px; background: #2196F3;">View Full Analytics</button>
      
      <div class="analytics" id="analytics">
        <h3>📊 Analytics</h3>
        <div class="stat">
          <span>Total Clicks:</span>
          <strong id="clicks">0</strong>
        </div>
        <div class="stat">
          <span>Created:</span>
          <strong id="created">-</strong>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function shortenUrl() {
      const originalUrl = document.getElementById('originalUrl').value.trim();
      const errorDiv = document.getElementById('error');
      const resultDiv = document.getElementById('result');
      
      errorDiv.classList.remove('show');
      resultDiv.classList.remove('show');
      
      if (!originalUrl) {
        showError('Please enter a URL');
        return;
      }
      
      try {
        new URL(originalUrl);
      } catch (e) {
        showError('Please enter a valid URL (include http:// or https://)');
        return;
      }
      
      try {
        const response = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ originalUrl })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          showError(data.message || 'Failed to shorten URL');
          return;
        }
        
        document.getElementById('shortUrl').value = data.shortUrl;
        resultDiv.classList.add('show');
        
        const shortCode = data.shortUrl.split('/').pop();
        fetchAnalytics(shortCode);
        
      } catch (error) {
        showError('Network error. Make sure the server is running.');
        console.error('Error:', error);
      }
    }

    async function fetchAnalytics(shortCode) {
      try {
        const response = await fetch(`/analytics/${shortCode}`);
        const data = await response.json();
        
        if (response.ok) {
          document.getElementById('clicks').textContent = data.totalClicks;
          document.getElementById('created').textContent = new Date(data.createdAt).toLocaleString();
        }
      } catch (error) {
        console.error('Failed to fetch analytics:', error);
      }
    }

    function refreshAnalytics() {
      const shortUrl = document.getElementById('shortUrl').value;
      const shortCode = shortUrl.split('/').pop();
      
      if (!shortCode) {
        showError('No short code found');
        return;
      }
      
      window.location.href = `/analytics.html?code=${shortCode}`;
    }

    function copyUrl() {
      const shortUrlInput = document.getElementById('shortUrl');
      const copyBtn = event.target;
      
      shortUrlInput.select();
      shortUrlInput.setSelectionRange(0, 99999);
      
      navigator.clipboard.writeText(shortUrlInput.value)
        .then(() => {
          const originalText = copyBtn.textContent;
          copyBtn.textContent = '✓ Copied!';
          copyBtn.style.background = '#4caf50';
          
          setTimeout(() => {
            copyBtn.textContent = originalText;
            copyBtn.style.background = '';
          }, 2000);
        })
        .catch(err => {
          console.error('Failed to copy:', err);
          showError('Failed to copy to clipboard');
        });
    }

    function showError(message) {
      const errorDiv = document.getElementById('error');
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
    }

    document.getElementById('originalUrl').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') shortenUrl();
    });
  </script>
</body>
</html>
